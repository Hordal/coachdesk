[project]
name = "fight-review-backend"
version = "0.1.0"
description = "격투기 영상 복기 도구 백엔드(기본 구조, fixture 모드)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "jsonschema>=4.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
faulthandler_timeout = 120  # 한 시험이 120초를 넘기면 모든 스레드의 스택을 출력해 멈춤 원인을 남긴다
